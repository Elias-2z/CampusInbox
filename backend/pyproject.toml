[project]
name = "campus-inbox"
version = "0.1.0"
description = "CampusInbox local API service"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cryptography>=50.0.2",
    "dateparser>=1.4.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "icalendar>=7.3.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
