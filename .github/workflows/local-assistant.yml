name: Windows local assistant

on:
  pull_request:
    paths:
      - 'local-assistant/**'
      - '.github/workflows/local-assistant.yml'
  push:
    branches: [main]
    paths:
      - 'local-assistant/**'
      - '.github/workflows/local-assistant.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-assistant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-assistant:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: local-assistant
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: local-assistant/frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          enable-cache: false
      - run: uv python install 3.12
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint:check
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: uv run --no-project --python 3.12 python -B -m unittest discover -s tests -q
